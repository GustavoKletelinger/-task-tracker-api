name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  qualidade-e-build:
    name: Lint, Formatacao, Tipos e Build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo-fonte
        uses: actions/checkout@v4

      - name: Habilitar o pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Validar padronizacao de codigo (ESLint)
        run: pnpm run lint

      - name: Validar formatacao (Prettier)
        run: pnpm run format:check

      - name: Checagem de tipos (tsc --noEmit)
        run: pnpm run type-check

      - name: Compilar o projeto (build)
        run: pnpm run build

      - name: Validar construcao da imagem Docker
        run: docker build -t task-tracker-api:ci .
